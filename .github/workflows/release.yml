name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, Attest & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -race -count=1 ./...

      - name: Cross-Compile & Package Binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="$REF_NAME"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "dev")"
          fi

          TARGETS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/arm64"
            "linux/amd64"
            "windows/amd64"
          )

          for target in "${TARGETS[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            bin_name="soulcaster"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            
            pkg_dir="dist/pkg_${os}_${arch}"
            mkdir -p "$pkg_dir"
            
            echo "==> Building ${os}/${arch}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -ldflags="-s -w" \
              -o "$pkg_dir/${bin_name}${ext}" ./cmd/soulcaster

            [ -f README.md ] && cp README.md "$pkg_dir/" || true
            [ -f LICENSE ] && cp LICENSE "$pkg_dir/" || true

            if [ "$os" = "windows" ]; then
              (cd "$pkg_dir" && zip -q -r "../../dist/soulcaster_${VERSION}_${os}_${arch}.zip" .)
            else
              tar -czf "dist/soulcaster_${VERSION}_${os}_${arch}.tar.gz" -C "$pkg_dir" .
            fi
            rm -rf "$pkg_dir"
          done

          echo "==> Generating checksums..."
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Attest Build Provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
